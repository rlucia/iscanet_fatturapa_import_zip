# pre-commit configuration for the Iscanet FatturaPA ZIP Import module.
#
# Single-module repository: there is no aggregate "addons" tree to scan,
# so we drop the multi-addon-specific OCA hooks (oca-update-pre-commit-
# excluded-addons, oca-gen-external-dependencies, oca-fix-manifest-website,
# oca-gen-addon-readme). What remains is a focused pipeline: code
# formatters first, then linters that read those formatters' output.
#
# Order is deliberate:
#   1. whool-init seeds pyproject.toml on a fresh checkout.
#   2. prettier and ruff-format do the auto-fixing.
#   3. pre-commit-hooks (whitespace, EOF, line-endings, etc.) run after
#      formatting so they don't fight the formatters.
#   4. Style/lint checks (eslint, ruff lint, pylint_odoo) run last.

minimum_pre_commit_version: "3.0.0"

exclude: |
  (?x)
  # Autogenerated landing page in the Apps store, do not reformat.
  ^static/description/index\.html$|
  # Bundled vendor code (e.g. third-party JS libraries) is left untouched.
  /static/(src/)?lib/|
  # Don't reformat the LICENSE text.
  ^LICENSE$|
  # Test data archives must remain byte-identical.
  /tests/data/|
  # Markdown / RST READMEs in subfolders are author prose, not config.
  /readme/.*\.(rst|md)$

default_language_version:
  python: python3

repos:
  - repo: https://github.com/sbidoul/whool
    rev: v1.2
    hooks:
      - id: whool-init

  - repo: local
    hooks:
      - id: prettier
        name: prettier (with plugin-xml)
        entry: prettier
        args: [--write, --list-different, --ignore-unknown]
        types: [text]
        files: \.(css|htm|html|js|json|jsx|less|md|scss|toml|ts|xml|yaml|yml)$
        language: node
        additional_dependencies:
          - "prettier@3.3.3"
          - "@prettier/plugin-xml@3.4.1"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.pot?$
      - id: end-of-file-fixer
        exclude: \.pot?$
      - id: check-case-conflict
      - id: check-merge-conflict
        exclude: /README\.rst$
      - id: check-symlinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: eslint
        args: [--color, --fix]
        verbose: true
        types: [javascript]
        language: node
        additional_dependencies:
          - "eslint@9.12.0"
          - "eslint-plugin-jsdoc@50.3.1"

  - repo: https://github.com/OCA/pylint-odoo
    rev: v9.1.3
    hooks:
      - id: pylint_odoo
        args: [--rcfile=.pylintrc]
